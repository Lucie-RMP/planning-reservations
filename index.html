<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning machines</title>
<script src="https://grist.numerique.gouv.fr/grist-plugin-api.js"></script>
<style>
:root{--bg:#f6f7f9;--pn:#fff;--tx:#1b2430;--mu:#6b7686;--ln:#dde1e7;--ac:#1f4e79;--ok:#15803d;--ko:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#14181f;--pn:#1c222b;--tx:#e6e9ee;--mu:#98a2b3;--ln:#2d3541;--ac:#7cb2e6;--ok:#4ade80;--ko:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 "Segoe UI",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--pn);border-bottom:1px solid var(--ln)}
header h1{font-size:15px;margin:0 auto 0 0}
button,select,input{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:4px;padding:4px 8px}
button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac)}
button.p{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
#al{margin:8px 12px 0;padding:8px 10px;border-left:4px solid #f59e0b;background:var(--pn);display:none}
#wrap{overflow-x:auto;margin:10px 12px;border:1px solid var(--ln);background:var(--pn)}
.row{display:flex;border-bottom:1px solid var(--ln);min-height:36px}
.lab{position:sticky;left:0;z-index:3;flex:0 0 190px;background:var(--pn);padding:6px 8px;border-right:1px solid var(--ln);display:flex;align-items:center;gap:6px}
.lab small{color:var(--mu);margin-left:auto}
.dot{width:9px;height:9px;border-radius:50%;flex:none}.dot.f{background:var(--ok)}.dot.b{background:var(--ko)}
.trk{position:relative;flex:none;background-image:repeating-linear-gradient(90deg,var(--ln) 0 1px,transparent 1px 26px)}
.hd .trk{height:30px}.day{position:absolute;top:0;height:100%;padding:6px;border-left:2px solid var(--mu);font-weight:600}
.bar{position:absolute;top:4px;height:22px;border-radius:3px;color:#fff;padding:2px 6px;font-size:12px;white-space:nowrap;overflow:hidden;cursor:pointer;background:#64748b}
.bar.ghost{opacity:.4}
.bar.rej{top:27px;height:7px;padding:0;background:repeating-linear-gradient(45deg,var(--ko) 0 4px,transparent 4px 8px)!important;border:1px solid var(--ko)}
.bar.maintenance{background:#d97706!important}.bar.demo{background:#7c3aed!important}
.bar.out_of_service{background:repeating-linear-gradient(45deg,#7f1d1d 0 6px,#b91c1c 6px 12px)!important}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--ko);z-index:2}
.lg{margin:0 12px;color:var(--mu);display:flex;gap:14px;flex-wrap:wrap}
.lg i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:4px}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:6px;max-width:460px;width:92%}
dialog::backdrop{background:#0006}
label{display:block;margin:8px 0 2px;color:var(--mu)}
.g2{display:flex;gap:6px}.g2>*{flex:1}
.mcs{display:flex;flex-wrap:wrap;gap:4px 12px}.mcs label{margin:0;color:var(--tx)}
#res{margin-top:10px;font-weight:600}
.ok{color:var(--ok)}.ko{color:var(--ko)}
</style></head><body>
<header>
  <h1>Planning des machines</h1>
  <button id="pv" title="Semaine précédente">◀</button>
  <input type="date" id="st" aria-label="Date de début">
  <button id="nx" title="Semaine suivante">▶</button>
  <select id="nd" aria-label="Durée affichée"><option value="5">1 semaine</option><option value="10" selected>2 semaines</option><option value="20">4 semaines</option></select>
  <label style="margin:0"><input type="checkbox" id="rj" checked> Voir les refus</label>
  <button class="p" id="nw">Réserver</button>
</header>
<div id="al"></div>
<div id="wrap"><div id="g"></div></div>
<div class="lg"><span><i style="background:#64748b"></i>Réservation (couleur de la machine)</span><span><i style="background:#d97706"></i>Maintenance</span><span><i style="background:#7c3aed"></i>Démo</span><span><i style="background:#b91c1c"></i>Hors service</span><span><i style="background:#64748b;opacity:.4"></i>Machine bloquée par la réservation</span><span>Trait rayé rouge : demande refusée</span></div>

<dialog id="dt"><div id="dtc"></div><div class="g2" style="margin-top:12px"><button id="dl">Supprimer</button><button id="dx">Fermer</button></div></dialog>

<dialog id="fm"><form id="f" method="dialog">
  <b>Nouvelle réservation</b>
  <label>Type</label><select name="ty"><option>reservation</option><option>maintenance</option><option>out of service</option><option>demo</option></select>
  <label>Machines</label><div class="mcs" id="mcs"></div>
  <label>Cellule</label><select name="ce"></select>
  <div class="g2"><div><label>Début</label><input type="date" name="d1" required></div><div><label>Heure</label><select name="h1"></select></div></div>
  <div class="g2"><div><label>Fin</label><input type="date" name="d2" required></div><div><label>Heure</label><select name="h2"></select></div></div>
  <label>Mode Autonox (si rail utilisé)</label><select name="am"><option value="">—</option><option>full</option><option>half</option></select>
  <label>Motif</label><input name="mo" maxlength="200" style="width:100%">
  <div class="g2" style="margin-top:12px"><button class="p" type="button" id="sd">Envoyer</button><button type="button" id="fx">Annuler</button></div>
  <div id="res" role="status"></div>
</form></dialog>

<script>
const HW=26,H0=8,H1=19,HD=H1-H0;
const S={start:'2026-10-01',n:10};
const D={r:[],m:[],c:[],u:{}};
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const L=v=>Array.isArray(v)?(v[0]==='L'?v.slice(1):v):[];
const rows=t=>{const k=Object.keys(t);return t.id.map((id,i)=>{const o={};k.forEach(c=>o[c]=t[c][i]);return o})};
const fmt=ts=>new Date(ts*1000).toLocaleString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const mname=id=>(D.m.find(m=>m.id===id)||{}).nom||('#'+id);

function days(){const a=[];let d=new Date(S.start+'T00:00');while(a.length<S.n){if(d.getDay()%6)a.push(new Date(d));d.setDate(d.getDate()+1)}return a}
function pos(ts,ds){for(let i=0;i<ds.length;i++){const a=new Date(ds[i]).setHours(H0,0,0,0)/1e3,b=new Date(ds[i]).setHours(H1,0,0,0)/1e3;if(ts<=a)return i*HD;if(ts<=b)return i*HD+(ts-a)/3600}return ds.length*HD}

async function load(){
  const [r,m,c,u]=await Promise.all(['Reservation','Machines','Cellules','Utilisateurs'].map(n=>grist.docApi.fetchTable(n)));
  D.r=rows(r).filter(x=>x.Debut&&x.Fin);D.m=rows(m).filter(x=>x.Actif);D.c=rows(c);
  D.u=Object.fromEntries(rows(u).map(x=>[x.id,x.nom]));
  render();
}

function render(){
  const ds=days(),W=ds.length*HD*HW,now=Date.now()/1e3,tot=ds.length*HD,rj=$('rj').checked;
  const g=$('g');g.replaceChildren();g.style.width=(W+190)+'px';
  const hd=el('div','row hd');hd.append(el('div','lab','Machine'));
  const th=el('div','trk');th.style.width=W+'px';
  ds.forEach((d,i)=>{const x=el('div','day',d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'}));x.style.left=i*HD*HW+'px';x.style.width=HD*HW+'px';th.append(x)});
  hd.append(th);g.append(hd);
  D.m.forEach(m=>{
    const row=el('div','row'),trk=el('div','trk');trk.style.width=W+'px';
    let used=0;
    const busy=D.r.some(e=>e.Statut==='confirmed'&&e.Debut<=now&&e.Fin>now&&L(e.Occupe).includes(m.id));
    D.r.forEach(e=>{
      const own=L(e.Machines).includes(m.id),occ=L(e.Occupe).includes(m.id),rej=e.Statut!=='confirmed';
      if(rej?!(own&&rj):!occ)return;
      const s=pos(e.Debut,ds),f=pos(e.Fin,ds);if(f<=s)return;
      if(!rej&&e.Type==='reservation')used+=f-s;
      const b=el('div','bar '+(e.Type||'').replace(/ /g,'_')+(rej?' rej':'')+(own?'':' ghost'),rej?'':(e.Type==='reservation'?(D.u[e.Utilisateur]||'?'):e.Type));
      b.style.left=s*HW+'px';b.style.width=Math.max(4,(f-s)*HW)+'px';
      if(e.Type==='reservation'&&!rej)b.style.background=m.Couleur||'#64748b';
      b.title=fmt(e.Debut)+' → '+fmt(e.Fin)+(e.Message?'\n'+e.Message:'');
      b.onclick=()=>detail(e);trk.append(b);
    });
    const lab=el('div','lab');const dot=el('i','dot '+(busy?'b':'f'));dot.title=busy?'Occupée maintenant':'Libre maintenant';
    lab.append(dot,el('span','',m.nom),el('small','',Math.round(100*used/tot)+' %'));lab.title='Taux d\'occupation sur la période affichée';
    row.append(lab,trk);g.append(row);
  });
  const nx=pos(now,ds);
  if(now>new Date(ds[0]).setHours(H0,0,0,0)/1e3&&nx<tot){const l=el('div','now');l.style.left=(190+nx*HW)+'px';g.append(l);l.style.top='0';l.style.height='100%';l.style.position='absolute'}
  g.style.position='relative';
  const al=D.r.filter(e=>e.Alerte);
  $('al').style.display=al.length?'block':'none';
  $('al').textContent=al.length?('⚠ '+al.map(e=>e.Type+' #'+e.id+' chevauche les réservations : '+e.Alerte).join(' | ')):'';
}

function detail(e){
  const c=$('dtc');c.replaceChildren();
  const add=(k,v)=>{if(!v)return;const p=el('p');p.style.margin='4px 0';p.append(el('b','',k+' : '),document.createTextNode(v));c.append(p)};
  add('Type',e.Type);add('Machines',L(e.Machines).map(mname).join(', '));add('Début',fmt(e.Debut));add('Fin',fmt(e.Fin));
  add('Utilisateur',D.u[e.Utilisateur]);add('Motif',e.Motif);add('Statut',e.Statut);add('Message',e.Message);
  $('dl').onclick=async()=>{try{await grist.docApi.applyUserActions([['RemoveRecord','Reservation',e.id]]);$('dt').close();load()}catch(x){alert('Suppression refusée : '+x.message)}};
  $('dt').showModal();
}

function initForm(){
  const f=$('f');
  $('mcs').replaceChildren(...D.m.map(m=>{const l=el('label');const i=document.createElement('input');i.type='checkbox';i.className='mc';i.value=m.id;l.append(i,' '+m.nom);return l}));
  f.ce.replaceChildren(new Option('—',''),...D.c.map(c=>new Option(c.nom,c.id)));
  f.h1.replaceChildren(...[...Array(11)].map((_,i)=>new Option(H0+i+'h',H0+i)));
  f.h2.replaceChildren(...[...Array(11)].map((_,i)=>new Option(H0+1+i+'h',H0+1+i)));
  f.h2.value=12;$('res').textContent='';
}
async function send(){
  const f=$('f'),ms=[...document.querySelectorAll('.mc:checked')].map(x=>+x.value);
  if(!f.d1.value||!f.d2.value||!ms.length){$('res').className='ko';$('res').textContent='Choisissez au moins une machine et les dates.';return}
  const t=(d,h)=>new Date(d+'T'+String(h).padStart(2,'0')+':00').getTime()/1e3;
  const rec={Machines:['L',...ms],Debut:t(f.d1.value,f.h1.value),Fin:t(f.d2.value,f.h2.value),Type:f.ty.value,Motif:f.mo.value};
  if(f.ce.value)rec.Cellule=+f.ce.value;
  if(f.am.value)rec.Mode_Autonox=f.am.value;
  try{
    const r=await grist.docApi.applyUserActions([['AddRecord','Reservation',null,rec]]);
    await load();
    const n=D.r.find(x=>x.id===r.retValues[0]);
    const ok=n&&n.Statut==='confirmed';
    $('res').className=ok?'ok':'ko';
    $('res').textContent=ok?'Réservation confirmée.':'Refusée : '+((n&&n.Message)||'vérifiez les champs.');
  }catch(x){$('res').className='ko';$('res').textContent='Action refusée : '+x.message}
}

grist.ready({requiredAccess:'full'});
let tm;grist.onRecords(()=>{clearTimeout(tm);tm=setTimeout(load,250)});
$('st').value=S.start;
$('st').onchange=e=>{if(e.target.value){S.start=e.target.value;render()}};
$('nd').onchange=e=>{S.n=+e.target.value;render()};
$('rj').onchange=render;
const shift=k=>{const d=new Date(S.start+'T00:00');d.setDate(d.getDate()+7*k);S.start=d.toLocaleDateString('sv-SE');$('st').value=S.start;render()};
$('pv').onclick=()=>shift(-1);$('nx').onclick=()=>shift(1);
$('nw').onclick=()=>{initForm();$('fm').showModal()};
$('fx').onclick=()=>$('fm').close();$('dx').onclick=()=>$('dt').close();
$('sd').onclick=send;
load();
</script></body></html>
